<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Construction</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #0d0d10;
      color: #bebec8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .construcao {
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .construcao__icone {
      width: 56px;
      height: 56px;
      fill: #b02e38;
    }

    .construcao__titulo {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }

    .construcao__texto {
      font-size: 16px;
      line-height: 1.6;
    }

    .construcao__copy {
      margin-top: 16px;
      font-size: 12px;
      color: #6b6b75;
    }
  </style>
</head>

<body>

  <main class="construcao">
    <svg class="construcao__icone" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" />
    </svg>
    <h1 class="construcao__titulo">Under Construction</h1>
    <p class="construcao__texto">We're working on something new. Please check back soon.</p>
    <p class="construcao__copy">© 2026 SodaPeak. All rights reserved.</p>
  </main>

</body>

</html>
